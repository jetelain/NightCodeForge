name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Pack CLI
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version number
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
          else
            VERSION="0.1.0-preview.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore NightCodeForge.slnx

      - name: Build solution
        run: dotnet build NightCodeForge.slnx -c Release --no-restore -p:Version=${{ env.VERSION }}
        env:
          SixLaborsLicenseKey: ${{secrets.SixLaborsLicenseKey}}

      - name: Run unit & integration tests
        run: dotnet test NightCodeForge.slnx -c Release --no-build -m:1 --filter "Category!=Acceptance&Category!=E2E" --verbosity normal

      - name: Pack NightCodeForge.Cli NuGet tool
        run: dotnet pack src/NightCodeForge.Cli/NightCodeForge.Cli.csproj -c Release --no-build -p:Version=${{ env.VERSION }} -o ./artifacts/nuget

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/nuget/*.nupkg
          if-no-files-found: error

  test-linux:
    name: Test Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NightCodeForge.slnx

      - name: Build solution
        run: dotnet build NightCodeForge.slnx -c Release --no-restore
        env:
          SixLaborsLicenseKey: ${{secrets.SixLaborsLicenseKey}}
          
      - name: Run unit & integration tests (Linux)
        run: dotnet test NightCodeForge.slnx -c Release --no-build -m:1 --filter "Category!=Acceptance&Category!=E2E" --verbosity normal

  publish:
    name: Publish (${{ matrix.rid }})
    needs:
      - build-and-test
      - test-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15-intel
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT & Avalonia X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lldb zlib1g-dev libicu-dev libssl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libfontconfig1-dev zip

      - name: Publish Web Bundle & Native AOT Installer
        shell: bash
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p ./dist/web ./dist/web/bin ./dist/launcher ./dist/setup ./artifacts

          dotnet publish src/NightCodeForge.Web/NightCodeForge.Web.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${VERSION}" \
            -o ./dist/web

          dotnet publish src/NightCodeForge.Launcher/NightCodeForge.Launcher.csproj \
            -c Release \
            -r "${RID}" \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${VERSION}" \
            -o ./dist/launcher

          if [[ "${RID}" == win-* ]]; then
            cp ./dist/launcher/ncf-web.exe ./dist/web/nightcodeforge-web.exe
            cp ./dist/launcher/ncf-web.exe ./dist/web/bin/nightcodeforge-web.exe
            cp ./dist/launcher/ncf-web.exe ./dist/web/bin/ncf-web.exe
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' \
              'exec "$DIR/ncf-web.exe" "$@"' \
              > ./dist/web/bin/nightcodeforge-web
          else
            cp ./dist/launcher/ncf-web ./dist/web/nightcodeforge-web
            cp ./dist/launcher/ncf-web ./dist/web/bin/nightcodeforge-web
            cp ./dist/launcher/ncf-web ./dist/web/bin/ncf-web
            chmod +x ./dist/web/NightCodeForge.Web ./dist/web/nightcodeforge-web ./dist/web/bin/nightcodeforge-web ./dist/web/bin/ncf-web
          fi

          printf '%s\n' \
            '{' \
            '  "ConnectionStrings": {' \
            '    "DefaultConnection": "Data Source=data/nightcodeforge.db;",' \
            '    "HangfireConnection": "Data Source=data/nightcodeforge_hangfire.db;"' \
            '  },' \
            '  "Logging": {' \
            '    "LogLevel": {' \
            '      "Default": "Warning",' \
            '      "NightCodeForge": "Information"' \
            '    },' \
            '    "LogsDirectory": "logs"' \
            '  },' \
            '  "Urls": "http://localhost:5270"' \
            '}' \
            > ./dist/web/appsettings.Production.json

          find ./dist/web \( -name '*.pdb' -o -name '*.dbg' \) -type f -delete
          find ./dist/web -type d -name '*.dSYM' -prune -exec rm -rf {} +
          if [[ -d ./skills ]]; then
            cp -r ./skills ./dist/web/skills
          fi
          printf '%s\n' "${VERSION}" > ./dist/web/VERSION
          cp README.md LICENSE ./dist/web/

          dotnet publish src/NightCodeForge.Installer/NightCodeForge.Installer.csproj \
            -c Release \
            -r "${RID}" \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="${VERSION}" \
            -o ./dist/setup

          find ./dist/setup \( -name '*.pdb' -o -name '*.dbg' \) -type f -delete
          find ./dist/setup -type d -name '*.dSYM' -prune -exec rm -rf {} +
          cp README.md LICENSE ./dist/setup/
        env:
          SixLaborsLicenseKey: ${{secrets.SixLaborsLicenseKey}}
          
      - name: Package zip archives & SHA256SUMS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $webZip = "./artifacts/NightCodeForge-Web-$env:RID.zip"
          $setupZip = "./artifacts/NightCodeForge-Setup-$env:RID.zip"
          Compress-Archive -Path ./dist/web/* -DestinationPath $webZip -Force
          Compress-Archive -Path ./dist/setup/* -DestinationPath $setupZip -Force
          $sums = @(
            $webZip,
            $setupZip
          ) | ForEach-Object {
            $hash = (Get-FileHash -Path $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = [System.IO.Path]::GetFileName($_)
            "$hash  $name"
          }
          $content = ($sums -join "`n") + "`n"
          [System.IO.File]::WriteAllText("./artifacts/SHA256SUMS-$env:RID.txt", $content, [System.Text.UTF8Encoding]::new($false))

      - name: Package zip archives & SHA256SUMS (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          (cd ./dist/web && zip -r "../../artifacts/NightCodeForge-Web-${RID}.zip" .)
          (cd ./dist/setup && zip -r "../../artifacts/NightCodeForge-Setup-${RID}.zip" .)
          (
            cd ./artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "NightCodeForge-Web-${RID}.zip" "NightCodeForge-Setup-${RID}.zip" > "SHA256SUMS-${RID}.txt"
            else
              shasum -a 256 "NightCodeForge-Web-${RID}.zip" "NightCodeForge-Setup-${RID}.zip" > "SHA256SUMS-${RID}.txt"
            fi
          )

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.rid }}
          path: ./artifacts/*
          if-no-files-found: error

  release:
    name: NuGet & GitHub Release
    permissions:
      contents: write
      id-token: write
    needs:
      - build-and-test
      - test-linux
      - publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download build and publish artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Merge unified SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd ./release-artifacts
          {
            cat SHA256SUMS-*.txt
            for pkg in NightCodeForge.Cli.*.nupkg; do
              sha256sum "${pkg}"
            done
          } | tr -d '\r' | LC_ALL=C sort -k2 -u > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'jetelain' }}

      - name: Push NightCodeForge.Cli to NuGet.org
        run: |
          dotnet nuget push ./release-artifacts/NightCodeForge.Cli.*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./release-artifacts/NightCodeForge-Web-*.zip
            ./release-artifacts/NightCodeForge-Setup-*.zip
            ./release-artifacts/NightCodeForge.Cli.*.nupkg
            ./release-artifacts/SHA256SUMS.txt
